project:
  seed: 42

source:
  site: stats.stackexchange.com
  dump_path: data/raw/stats.stackexchange.com/Posts.xml

eval_carveout:
  target_size: 700
  score_bucket_edges: [-100, 0, 3, 8, 100000]

labeling:
  top_quantile: 0.75
  bottom_quantile: 0.25

dedup:
  similarity_threshold: 0.97
  top_k_neighbors: 10

paths:
  interim: data/interim
  eval: data/eval
  models_classifier: models/classifier

evaluation:
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  held_out_path: data/eval/held_out.jsonl
  mmlu_path: data/eval/mmlu_subset.jsonl
  output_path: reports/evaluation
  seed: 42
  perplexity_max_examples: 700
  judge_max_examples: 100
  mmlu_max_examples: 200
  judge_endpoint: https://api.openai.com/v1
  judge_model: gpt-4.1-mini
