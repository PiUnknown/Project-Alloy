[project]
name = "alloy"
version = "0.1.0"
description = "Data-centric fine-tuning ablation pipeline"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "faiss-cpu",
    "sentence-transformers",
    "scikit-learn",
    "numpy",
    "joblib",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
evaluation = ["torch>=2.2", "transformers>=4.45", "datasets>=3.0", "peft>=0.13"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
